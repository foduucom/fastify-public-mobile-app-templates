  flutter_inappwebview: ^6.1.5
dev_dependencies:
  flutter_lints: ^2.0.1
  lints: ^2.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  intl: ^0.19.0
  html: ^0.15.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/vic_icon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/vic_icon_foreground.png"
 

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lotti/
    - assets/icon/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/font/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/font/Poppins/Poppins-Bold.ttf
          weight: 700
