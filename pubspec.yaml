name: foduu_ecommerce
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.6
  get: ^4.7.3
  flutter_native_splash: ^2.3.10
  flutter_stripe: ^10.1.1
  razorpay_flutter: ^1.3.5
  # iconsax: ^0.0.8
  flutter:
    sdk: flutter
  lottie: ^1.4.1
  flutter_svg: ^2.0.7
  sms_autofill: ^2.2.0
  http: ^1.6.0
  awesome_notifications: ^0.10.1
  get_storage: ^2.0.3
  intl: ^0.20.2
  flutter_downloader: ^1.11.3
  permission_handler: ^11.0.1
  image_picker: ^1.0.4
  flutter_image_compress: ^2.2.0
  url_launcher: ^6.1.14
  connectivity_plus: ^5.0.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  timeline_tile: ^2.0.0
  clipboard: ^0.1.3
  flutter_badged: ^2.0.3
  flutter_staggered_grid_view: ^0.6.2
  flutter_launcher_icons: ^0.13.1
  fluttertoast: ^8.2.4
  js: ^0.6.2
  font_awesome_flutter: ^10.12.0
  flutter_rating_bar: ^4.0.1
  flutter_html: ^3.0.0-alpha.2
  dotted_border: ^2.0.0+3
  google_fonts: ^4.0.4
  dio: ^5.9.2
  path_provider: ^2.0.2
  cached_network_image: ^3.3.1
  expansion_tile_card: ^3.0.0
  http_cookie_store: ^0.0.2
  photo_view: ^0.14.0
  flutter_widget_from_html:
  gallery_image_viewer: ^1.2.0
  device_info_plus: ^9.1.2
  crypto: ^3.0.3
  pin_code_fields: ^8.0.1
  socket_io_client: ^3.1.4
  args: ^2.4.2
  path: ^1.8.3
  flutter_paypal_payment: ^1.0.5

  firebase_core: ^2.13.0
  firebase_messaging: ^14.6.1
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_lints: ^2.0.1
  lints: ^2.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

# dependency_overrides:
#   font_awesome_flutter:
#     path: font_awesome_flutter

flutter_native_splash:
  image: assets/images/app_logo.png
  android_12:
    image: assets/images/app_logo.png
    color: "#ffffff"
  fullscreen: true

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lotti/
    - assets/icon/
    - app_config.json
    - screenshot.webp

  fonts:
    - family: Lato
      fonts:
        - asset: assets/font/Lato/Lato-Regular.ttf
          weight: 600
        - asset: assets/font/Lato/Lato-Bold.ttf
          weight: 800
        - asset: assets/font/Lato/Lato-Light.ttf
          weight: 400
