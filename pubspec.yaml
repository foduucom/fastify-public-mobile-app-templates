name: foddu
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ── Core GetX & Storage ────────────────────────────────────────────────────
  get: ^4.7.3
  get_storage: ^2.0.3

  # ── Networking & HTTP ──────────────────────────────────────────────────────
  http: ^1.6.0
  dio: ^5.3.3
  http_cookie_store: ^0.0.2
  connectivity_plus: ^7.0.0
  socket_io_client: ^3.1.4

  # ── Firebase & Notifications ───────────────────────────────────────────────
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.1.2
  awesome_notifications: ^0.10.1

  # ── UI Components ──────────────────────────────────────────────────────────
  lottie: ^1.4.1
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  badges: ^3.1.2
  flutter_badged: ^2.0.3
  flutter_staggered_grid_view: ^0.6.2
  flutter_rating_bar: ^4.0.1
  flutter_html: ^3.0.0-alpha.2
  flutter_widget_from_html:
  dotted_border: ^2.0.0+3
  timeline_tile: ^2.0.0
  expansion_tile_card: ^3.0.0
  photo_view: ^0.14.0
  gallery_image_viewer: ^1.2.0
  pin_code_fields: ^8.0.1
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  font_awesome_flutter: ^10.12.0
  fluttertoast: ^8.2.4
  js: ^0.6.2

  # ── Forms, Input & OTP ─────────────────────────────────────────────────────
  sms_autofill: ^2.2.0
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  clipboard: ^0.1.3

  # ── AI & Voice ─────────────────────────────────────────────────────────────
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2

  # ── Payments ───────────────────────────────────────────────────────────────
  flutter_stripe: ^12.4.0
  razorpay_flutter: ^1.4.1
  phonepe_payment_sdk: ^3.0.2
  flutter_paypal_payment: ^1.0.8

  # ── Media & Files ──────────────────────────────────────────────────────────
  image_picker: ^1.0.4
  file_picker: ^8.1.4
  open_filex: ^4.3.4
  flutter_image_compress: ^2.2.0
  flutter_downloader: ^1.11.3
  path_provider: ^2.0.2
  permission_handler: ^11.0.1
  share_plus: ^10.1.4

  # ── WebView & URL ──────────────────────────────────────────────────────────
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.1.14

  # ── Utilities ──────────────────────────────────────────────────────────────
  device_info_plus: ^9.1.2
  crypto: ^3.0.3
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  lints: ^2.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/appIconlogo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/lotti/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/font/Lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/font/Lato/Lato-Light.ttf
          weight: 300
        - asset: assets/font/Lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/font/Lato/Lato-Black.ttf
          weight: 900
        - asset: assets/font/Lato/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/font/Lato/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/font/Lato/Lato-Thin.ttf
          weight: 100
        - asset: assets/font/Lato/Lato-LightItalic.ttf
          weight: 300
          style: italic
