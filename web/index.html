<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="foddu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>foddu</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
    }

    #startup-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 16px;
      color: #111;
      font: 500 14px system-ui, sans-serif;
      background: #fff;
      z-index: 9999;
      transition: opacity 160ms ease;
    }

    #startup-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #startup-loader[hidden] {
      display: none;
    }

    .startup-spinner {
      width: 28px;
      height: 28px;
      margin: auto;
      border: 3px solid #e8e8e8;
      border-top-color: #111;
      border-radius: 50%;
      animation: startup-spin 700ms linear infinite;
    }

    @keyframes startup-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-spinner { animation-duration: 1800ms; }
      #startup-loader { transition: none; }
    }
  </style>
</head>
<body>
  <div id="startup-loader" role="status" aria-live="polite">
    <div class="startup-spinner" aria-hidden="true"></div>
    <span>Loading Foddu…</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
