<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="foduu_ecommerce">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style id="inappwebview-theme-style">
    body.app-dark-mode iframe {
      filter: invert(0.92) hue-rotate(180deg) brightness(0.95) contrast(0.95) !important;
      background-color: #121212 !important;
      transition: filter 0.25s ease-in-out;
    }
    body.app-light-mode iframe {
      filter: none !important;
      background-color: #ffffff !important;
      transition: filter 0.25s ease-in-out;
    }
  </style>
  <script>
    window.setAppWebViewTheme = function(isDark) {
      try {
        if (isDark) {
          document.body.classList.add('app-dark-mode');
          document.body.classList.remove('app-light-mode');
        } else {
          document.body.classList.add('app-light-mode');
          document.body.classList.remove('app-dark-mode');
        }
        var iframes = document.querySelectorAll('iframe');
        iframes.forEach(function(iframe) {
          if (isDark) {
            iframe.style.filter = 'invert(0.92) hue-rotate(180deg) brightness(0.95) contrast(0.95)';
            iframe.style.backgroundColor = '#121212';
          } else {
            iframe.style.filter = 'none';
            iframe.style.backgroundColor = '#ffffff';
          }
        });
      } catch (e) {
        console.warn('Error setting webview theme:', e);
      }
    };
  </script>
  <script type="application/javascript" src="assets/packages/flutter_inappwebview_web/assets/web/web_support.js" defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
